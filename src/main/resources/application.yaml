server:
  port: ${BUSINESS_SERVICE_PORT:8086}

spring:
  banner:
    location: classpath:banner.txt
    mode: console
  application:
    name: x-business-service
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        # Realtime events are best effort; never wait long for a missing broker.
        max.block.ms: 2000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  task:
    scheduling:
      pool:
        # Telegram long polling holds one thread; the daily summary needs another.
        size: 2

x:
  http:
    logging:
      enabled: true
      server: x-business-service
      hop: "x-api-gateway → x-bff → x-business-service"
      hops:
        /api/v1/businesses: "x-api-gateway → x-bff → x-business-service"
  telegram:
    # Bot from @BotFather that sends merchant alerts; alerts stay off while it is empty.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:true}
  exchange-rate:
    frankfurter-rate-url: ${FRANKFURTER_RATE_URL:https://api.frankfurter.dev/v2/rate/usd/khr}
    refresh-cron: ${EXCHANGE_RATE_REFRESH_CRON:0 15 6 * * *}
  redis:
    enabled: ${X_REDIS_ENABLED:true}
    key-prefix: x
    default-ttl: 10m
    caches:
      business-by-id: 15m
      businesses-by-owner: 30m
