server:
  port: ${BUSINESS_SERVICE_PORT:8086}

spring:
  banner:
    location: classpath:banner.txt
    mode: console
  application:
    name: x-business-service
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

x:
  http:
    logging:
      enabled: true
      server: x-business-service
      hop: "x-api-gateway → x-bff → x-business-service"
      hops:
        /api/v1/businesses: "x-api-gateway → x-bff → x-business-service"
  redis:
    enabled: ${X_REDIS_ENABLED:true}
    key-prefix: x
    default-ttl: 10m
    caches:
      business-by-id: 15m
      businesses-by-owner: 30m
